name: pages

# Publish the committed site/ folder: on a human push that changes it, and after every
# ladder run (the ladder commits site/ with the Actions token, and GitHub does not start
# push-triggered workflows for such commits, so the ladder's completion is the trigger, even a
# run that timed out, because it saves after each bot).
# Needs neither the engine nor any secret.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: [ladder, ladder-full]
    types: [completed]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's own Pages workflows have: the site is uploaded in one and published in the
# next. In one job the publish step asked for the upload half a second after it finished, and now
# and then GitHub had not listed it yet ("Found 0 artifact(s)"), so the run failed and the page
# stayed a day behind.

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
