name: ladder

# The leaderboard run. Bots play each other first, the top of the table before the rest, and a
# bot the run was started for meets the top bots before anything else. Then every new or changed
# bot plays the anchors it has not met, in duplicate sets, with the time left. A bot on an older
# engine commit plays them all again. A bot's result and the rebuilt site/ are committed after
# each match, so a run that times out carries on from there the next
# night; pages.yml runs when this workflow completes and publishes site/ to GitHub Pages. Model
# files come from Hugging Face (models.lock.json). An anchor whose files are not there yet is
# left out. While it plays, it pushes its progress (no cards, no seed) to the ladder-live branch
# every 30 seconds for the home server's live board (arena/ladder_live.py).

on:
  schedule:
    - cron: "0 3 * * *"   # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      sets:
        description: duplicate sets per anchor (micro games are short and noisy, so 40)
        default: "40"
      bots:
        description: space-separated bot names (empty = all)
        default: ""
      replay:
        description: replay games these bots already played
        type: boolean
        default: false
      direct:
        description: play direct games between bots
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ladder
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      UV_NO_SYNC: "1"   # keep the environment installed below, even as saving moves to newer main
      LADDER_SETS: ${{ github.event.inputs.sets || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Allow uv to clone the private engine repo
        run: git config --global url."https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: uv sync --frozen
      - run: uv run python -m arena.models fetch
      - name: Play every bot against the anchors, then against each other
        env:
          # The leaderboard seed is a secret so nobody can tune to the exact deals it uses.
          # --hide-seed keeps it out of the public results and the page.
          LADDER_SEED: ${{ secrets.LADDER_SEED }}
        run: |
          # arena.live writes each match's progress here; the plan lists the pairings to play.
          export ESTIMATION_LIVE="$RUNNER_TEMP/live" LADDER_PLAN="$RUNNER_TEMP/plan.tsv"
          git config user.name "estimation-arena bot"
          git config user.email "actions@users.noreply.github.com"
          sets="$LADDER_SETS"
          challengers="${{ github.event.inputs.bots }}"   # the bots this run was started for
          bots="$challengers"
          [ -n "$bots" ] || bots=$(ls bots)
          only_new="--only-new"
          [ "${{ github.event.inputs.replay }}" != "true" ] || only_new=""
          failed=""
          # The plan: every bot and anchor still to play, in order, for the live board too.
          : > "$LADDER_PLAN"
          for bot in $bots; do
            for spec in $(uv run python -m arena.run --bot "$bot" --due $only_new); do
              printf '%s\t%s\n' "$bot" "$spec" >> "$LADDER_PLAN"
            done
          done
          mkdir -p "$ESTIMATION_LIVE"
          export LADDER_STARTED_AT=$(date +%s)
          echo "LADDER_STARTED_AT=$LADDER_STARTED_AT" >> "$GITHUB_ENV"
          uv run python -m arena.ladder_live publish --live "$ESTIMATION_LIVE" --plan "$LADDER_PLAN" --every 30 &
          trap "kill $! 2>/dev/null || true" EXIT
          # One benchmark for one bot, saved as it finishes: a slow bot (an hour per benchmark)
          # keeps what it played when the job times out, and the next night plays only what is left.
          benchmark() {
            if uv run python -m arena.run --bot "$1" --anchors "$2" --sets "$sets" --seed "${LADDER_SEED:-0}" --workers 4 --progress --hide-seed --stop-when-settled </dev/null; then
              scripts/ladder-save.sh "results/$1.json" </dev/null
            else
              failed="$failed $1:$2"
            fi
          }
          # 1. A bot with no result yet plays its strongest benchmark, which puts it on the board.
          later="$RUNNER_TEMP/later.tsv"; : > "$later"
          while IFS=$'\t' read -r bot spec; do
            if [ -f "results/$bot.json" ]; then printf '%s\t%s\n' "$bot" "$spec" >> "$later"; else benchmark "$bot" "$spec"; fi
          done < "$LADDER_PLAN"
          # 2. The bots play each other, which is what the ladder is for. A bot this run was started
          # for is a challenger: it meets the top bot first, then the next, down the table. Other
          # pairs follow, best first.
          if [ "${{ github.event.inputs.direct }}" != "false" ]; then
            # Start a match only if it should finish before the job ends at 350 minutes (340 here,
            # leaving time to save). A slow pair waits for the next night, which starts with it;
            # a cheaper pair after it can still use the time left.
            for pair in $(uv run python -m arena.duels due --first $challengers); do
              need=$(uv run python -m arena.duels estimate "${pair%%:*}" "${pair##*:}")
              if [ $((SECONDS + need)) -gt 20400 ]; then
                echo "skipping $pair: needs about $((need / 60)) min, $(((20400 - SECONDS) / 60)) min left"
                continue
              fi
              if output=$(uv run python -m arena.duels play "${pair%%:*}" "${pair##*:}" --seed "${LADDER_SEED:-0}" --workers 4 --stop-when-settled); then
                echo "$output" | head -1
                scripts/ladder-save.sh "$(echo "$output" | tail -1)"
              else
                failed="$failed $pair"
              fi
            done
          fi
          # 3. The other benchmarks, strongest first, with whatever time is left. They only refine
          # a rating the matches between bots have already set.
          while IFS=$'\t' read -r bot spec; do
            [ "$SECONDS" -lt 16500 ] || { echo "out of time for benchmarks; the next run carries on"; break; }
            benchmark "$bot" "$spec"
          done < "$later"
          # Games people can watch, on public deals. They never count towards a rating.
          while IFS=$'\t' read -r a b; do
            [ "$SECONDS" -lt 18000 ] || { echo "out of time; the next run carries on"; break; }
            if file=$(uv run python -m arena.replay play "$a" "$b" </dev/null); then
              scripts/ladder-save.sh "$file"
            else
              failed="$failed $a:$b"
            fi
          done < <(uv run python -m arena.replay due)
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
      - name: Tell the live board the ladder has stopped
        if: always()
        run: |
          export ESTIMATION_LIVE="$RUNNER_TEMP/live" LADDER_PLAN="$RUNNER_TEMP/plan.tsv"
          [ -f "$LADDER_PLAN" ] || exit 0
          uv run python -m arena.ladder_live publish --live "$ESTIMATION_LIVE" --plan "$LADDER_PLAN" --finished
