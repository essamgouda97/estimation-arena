[project]
name = "estimation-arena"
version = "0.1.0"
description = "A competition harness and leaderboard for Estimation bots, built on estimation-engine."
requires-python = ">=3.12"
dependencies = [
    "estimation-engine",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]
# Optional: the PettingZoo environment for RL training (arena/env.py). uv sync --group rl
rl = ["pettingzoo>=1.24", "gymnasium>=1.0"]
# The live table server (arena/serve.py): uv sync --group table
table = ["websockets>=13"]
# The JAX rules (jaxenv/), GPU self-play: UV_PROJECT_ENVIRONMENT=.venv-jax uv sync --group jax
# 0.12.0.1 is the version verified on the home server's GTX 1070 (Pascal).
jax = ["jax[cuda12]==0.12.0.1", "optax>=0.2.4", "tensorboardX>=2.6"]

[tool.uv]
package = false

[tool.uv.sources]
estimation-engine = { git = "https://github.com/YosifElessawi/estimation-engine" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
